<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical Term Check</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root { --bg:#fff; --fg:#1f2937; --muted:#6b7280; --accent:#0d9488; --card:#f3f4f6; --ok:#bbf7d0; --bad:#fecaca; --warn:#fef08a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1f1f; --fg:#e5e7eb; --muted:#9ca3af; --accent:#2dd4bf; --card:#2b2b2b; --ok:#14532d; --bad:#7f1d1d; --warn:#713f12; } }
  body { font-family:"Segoe UI",Arial,sans-serif; margin:0; padding:12px; background:var(--bg); color:var(--fg); font-size:14px; }
  label { display:block; margin-top:8px; color:var(--muted); font-size:12px; }
  input,select { width:100%; box-sizing:border-box; padding:6px; border:1px solid var(--muted); border-radius:4px; background:var(--bg); color:var(--fg); }
  input[type=checkbox] { width:auto; }
  button { padding:6px 10px; border:0; border-radius:4px; background:var(--accent); color:#fff; cursor:pointer; }
  details { background:var(--card); border-radius:6px; padding:8px 10px; margin-bottom:8px; }
  .row { display:flex; gap:6px; margin-top:8px; } .row input { flex:1; }
  .verdict { margin-top:12px; padding:10px; border-radius:6px; font-weight:600; font-size:15px; }
  .ok { background:var(--ok); } .bad { background:var(--bad); } .warn { background:var(--warn); }
  .sub { font-weight:400; font-size:13px; margin-top:4px; }
  .meta { color:var(--muted); font-size:12px; margin-top:6px; }
  .sug { display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--card); border-radius:6px; padding:8px 10px; margin-top:6px; }
  .sug b { font-size:15px; } .note { color:var(--muted); font-size:12px; }
  #status { color:var(--muted); margin-top:8px; font-size:12px; }
</style>
</head>
<body>
<details id="settings">
  <summary>Settings</summary>
  <label>AI provider</label>
  <select id="provider"><option value="groq">Groq (free tier)</option><option value="gemini">Google Gemini</option><option value="ollama">Ollama (local, on this PC)</option></select>
  <label>API key (stored only in Word on this PC)</label>
  <input id="key" type="password" placeholder="Paste your API key">
  <label>Model</label><input id="model">
  <label>Spelling style</label>
  <select id="english"><option value="keep">Accept both British and American</option><option value="uk">British English</option><option value="us">American English</option></select>
  <label><input type="checkbox" id="track"> Replace as tracked change</label>
</details>

<label style="margin-top:0"><input type="checkbox" id="auto" checked> Check automatically when I select a word or term</label>
<div class="row"><input id="q" placeholder="Or type a term, e.g. pectoralis major"><button id="go">Check</button></div>
<div id="status">Select a word or short term (up to 6 words) in your document.</div>
<div id="result"></div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const DEFAULT_MODEL = { groq:"openai/gpt-oss-120b", gemini:"gemini-3.8-flash", ollama:"llama3.1" };
  let cfg = { provider:"groq", key:"", model:"", english:"keep", track:true };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem("gcfg") || "{}")); } catch (e) {}   // shares settings with the Grammar add-in
  try { $("auto").checked = localStorage.getItem("mauto") !== "0"; } catch (e) {}

  $("provider").value = cfg.provider; $("key").value = cfg.key; $("model").value = cfg.model || DEFAULT_MODEL[cfg.provider];
  $("english").value = cfg.english; $("track").checked = cfg.track;
  function saveCfg() {
    cfg = { provider:$("provider").value, key:$("key").value.trim(), model:$("model").value.trim(), english:$("english").value, track:$("track").checked };
    try { localStorage.setItem("gcfg", JSON.stringify(cfg)); localStorage.setItem("mauto", $("auto").checked ? "1" : "0"); } catch (e) {}
  }
  ["key","model","english","track","auto"].forEach(id => $(id).addEventListener("change", saveCfg));
  $("provider").addEventListener("change", () => { $("model").value = DEFAULT_MODEL[$("provider").value]; saveCfg(); });
  if (!cfg.key && cfg.provider !== "ollama") $("settings").open = true;

  function sys() {
    const style = { keep:"", uk:" The user requires British spelling: American-only spellings count as incorrect and the British form should be suggested.",
                    us:" The user requires American spelling: British-only spellings count as incorrect and the American form should be suggested." }[cfg.english];
    return "You are a spelling and terminology checker for medical transcription. The user sends one word or a short term " +
      "(anatomy, diagnoses, procedures, drugs, abbreviations, or ordinary English). Decide whether it is correctly spelled and valid, " +
      "either as a medical term or as an English word. British and American spellings are both valid unless a style is required; mention the variant in the summary." + style +
      " If it is incorrect, give up to 5 likely intended terms, best first, each with a short note. Never invent terms; " +
      "if you are not sure a rare term exists, set confidence to low. Respond ONLY with JSON: " +
      '{"term":"...","is_correct":true or false,"type":"medical term|English word|drug name|abbreviation|name|other","confidence":"high|medium|low","summary":"one short sentence","suggestions":[{"text":"...","note":"..."}]}';
  }

  async function callAI(text) {
    const model = cfg.model || DEFAULT_MODEL[cfg.provider]; let r, raw;
    if (cfg.provider === "groq") {
      const body = { model, temperature:0, response_format:{ type:"json_object" }, messages:[{ role:"system", content:sys() }, { role:"user", content:text }] };
      if (/^openai\/gpt-oss/.test(model)) body.reasoning_effort = "low";
      r = await fetch("https://api.groq.com/openai/v1/chat/completions", { method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + cfg.key }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error("Groq " + r.status + ": " + (await r.text()).slice(0, 200));
      raw = (await r.json()).choices[0].message.content;
    } else if (cfg.provider === "gemini") {
      r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent?key=" + encodeURIComponent(cfg.key),
        { method:"POST", headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ systemInstruction:{ parts:[{ text:sys() }] }, contents:[{ role:"user", parts:[{ text }] }],
            generationConfig:{ temperature:0, responseMimeType:"application/json" } }) });
      if (!r.ok) throw new Error("Gemini " + r.status + ": " + (await r.text()).slice(0, 200));
      raw = (await r.json()).candidates[0].content.parts[0].text;
    } else {
      r = await fetch("http://localhost:11434/api/chat", { method:"POST",
        body: JSON.stringify({ model, stream:false, format:"json", options:{ temperature:0 }, messages:[{ role:"system", content:sys() }, { role:"user", content:text }] }) });
      if (!r.ok) throw new Error("Ollama " + r.status + ": " + (await r.text()).slice(0, 200));
      raw = (await r.json()).message.content;
    }
    return JSON.parse(raw.replace(/^```(?:json)?\s*|\s*```$/g, "").trim());
  }

  const clean = s => String(s || "").replace(/\s+/g, " ").trim().replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9)]+$/g, "");
  const memo = new Map(); let last = "", timer = null, req = 0, checked = "";

  async function check(term) {
    saveCfg();
    if (cfg.provider !== "ollama" && !cfg.key) { $("status").textContent = "Add your API key in Settings first."; $("settings").open = true; return; }
    const my = ++req, key = term.toLowerCase() + "|" + cfg.english; checked = term;
    $("status").textContent = "Checking \"" + term + "\"..."; $("result").innerHTML = "";
    try {
      const t0 = performance.now();
      const res = memo.get(key) || await callAI(term); memo.set(key, res);
      if (my !== req) return;
      render(term, res); $("status").textContent = Math.round(performance.now() - t0) + " ms";
    } catch (e) { if (my === req) $("status").textContent = "Error: " + e.message; }
  }

  function render(term, r) {
    const low = r.confidence === "low", ok = r.is_correct === true;
    const cls = low ? "warn" : ok ? "ok" : "bad";
    const head = low ? "⚠ Not sure — please verify" : ok ? "✔ Correct" : "✘ Not correct";
    let h = '<div class="verdict ' + cls + '">' + head + ": " + esc(term) +
            (r.summary ? '<div class="sub">' + esc(r.summary) + "</div>" : "") + "</div>" +
            '<div class="meta">' + esc(r.type || "") + " · confidence: " + esc(r.confidence || "?") + "</div>";
    const sug = Array.isArray(r.suggestions) ? r.suggestions.slice(0, 5) : [];
    if (!ok || low) sug.forEach((s, i) => {
      h += '<div class="sug"><div><b>' + esc(s.text) + '</b><div class="note">' + esc(s.note || "") + '</div></div>' +
           '<button data-i="' + i + '">Use</button></div>';
    });
    $("result").innerHTML = h;
    $("result").querySelectorAll("button[data-i]").forEach(b => b.onclick = () => replaceWith(sug[+b.dataset.i].text));
  }

  async function replaceWith(text) {
    try {
      await Word.run(async ctx => {
        const sel = ctx.document.getSelection(); sel.load("text"); await ctx.sync();
        const m = sel.text.match(/^([\s"'(\[]*)([\s\S]*?)([\s.,;:!?)"'\]]*)$/);
        if (clean(m[2]).toLowerCase() !== checked.toLowerCase()) { $("status").textContent = "Selection changed — select the term again, then click Use."; return; }
        if (cfg.track) { try { ctx.document.changeTrackingMode = Word.ChangeTrackingMode.trackAll; await ctx.sync(); } catch (e) {} }
        sel.insertText(m[1] + text + m[3], "Replace"); await ctx.sync();
        last = text.toLowerCase(); $("status").textContent = "Replaced with \"" + text + "\".";
      });
    } catch (e) { $("status").textContent = "Could not replace: " + e.message; }
  }

  function onSelection() {
    if (!$("auto").checked) return;
    Office.context.document.getSelectedDataAsync(Office.CoercionType.Text, r => {
      if (r.status !== "succeeded") return;
      const t = clean(r.value);
      if (!t || t.length > 80 || t.split(" ").length > 6 || t.toLowerCase() === last) return;
      last = t.toLowerCase(); $("q").value = t;
      clearTimeout(timer); timer = setTimeout(() => check(t), 500);
    });
  }
  $("go").onclick = () => { const t = clean($("q").value); if (t) { last = t.toLowerCase(); check(t); } };
  $("q").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });

  if (typeof Office !== "undefined" && Office.onReady) Office.onReady(i => {
    if (i && i.host) Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged, onSelection);
  });
</script>
</body>
</html>
